<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h2>unordered list</h2>
    <ul>
        <li>ice cream</li>
        <li>chocolate</li>
        <li>cake</li>
        <li>trifle</li>
    </ul>

    <h2>ordered list</h2>
    <ol>
        <li>bun</li>
        <li>lettuce</li>
        <li>tomato sauce</li>
        <li>patty</li>
        <li>cheese</li>
    </ol>

    <h2>definition list</h2>
    <dt>tea
        <dd>hot drink</dd>
    </dt>
    <dt>coca cola
        <dd>cold drink</dd>
    </dt>

</body>
</html>
